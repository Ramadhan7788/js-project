<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&family=JetBrains+Mono:wght@100..800&family=Playfair+Display:wght@400..900&family=Space+Grotesk:wght@300..700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/svg+xml" href="Logo-new.svg">
    <title>Age Calculator</title>
</head>
<body>
    <main>
        <h1>Welcome to my page!</h1>
        <form class="age-form" id="age-form" >
            <div class="input-group">
                <input class="date-input" type="date" id="date" placeholder="dd / mm / yyyy">
                <button class="cal-btn" id="cal-btn">
                    <svg class="cal-icon" viewBox="0 0 24 24">
                        <path d="M24,24H0V3h5V0h2v3h10V0h2v3h5V24z M2,22h20V5H2v4h20v2H2V22z"/>
                    </svg>
                </button>
            </div>
            <button class="submit" type="submit">Calculate age</button>
        </form>
        <div class="result" id="result"></div>
    </main>
    <script type="module" src="script.js"></script>
</body>
</html>
