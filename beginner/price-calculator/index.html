<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="style.css">
  <title>Kalkulator Diskon & Pajak</title>
</head>
<body>

  <div class="card">
    <h2>Kalkulator Diskon & Pajak</h2>


    <div id="errorBox" class="error-message"></div>

    <form id="calculatorForm">
      <div class="form-group">
        <label for="price">Harga Awal (Rp):</label>
        <input type="number" id="price" placeholder="Contoh: 100000" step="any" required>
      </div>

      <div class="form-group">
        <label for="discount">Diskon (%):</label>
        <input type="number" id="discount" placeholder="0 - 100" step="any" required>
      </div>

      <div class="form-group">
        <label for="tax">Pajak (%):</label>
        <input type="number" id="tax" placeholder="0 - 100" step="any" required>
      </div>

      <button type="submit">Hitung Total</button>
    </form>


    <div class="result-box">
      <p>Potongan Diskon: <strong>Rp <span id="discountResult">0</span></strong></p>
      <p>Biaya Pajak: <strong>Rp <span id="taxResult">0</span></strong></p>
      <p class="total">Total Akhir: <strong>Rp <span id="finalPriceResult">0</span></strong></p>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
